services:
  - type: web
    name: klipani-bot
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: LICENSE_SECRET
        generateValue: true
      - key: DA_CLIENT_ID
        sync: false
      - key: DA_CLIENT_SECRET
        sync: false
      - key: DA_DONATE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
