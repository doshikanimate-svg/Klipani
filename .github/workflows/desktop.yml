name: KLIPANI desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend binary (PyInstaller)
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
          pyinstaller build/klipani.spec --distpath build/dist --workpath build/work --noconfirm

      - name: Frontend standalone
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desktop installer (electron-builder)
        run: |
          npm ci
          npx electron-builder --config electron/builder.json --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: klipani-${{ matrix.arch }}
          path: release/

  release:
    # Attaches both installers (+ updater metadata) to the GitHub Release
    # so electron-updater can find them. Runs only on version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
